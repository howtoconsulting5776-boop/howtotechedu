<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하우투테크에듀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 디자인 = 06. 와이어프레임 (v0.2 디자인): 흰 바탕·코발트 블루·기기 목업 / 번호 카드 / 남색 정보 구획 */
  :root { --white:#fff; --paper:#f5f7fb; --line:#e3e8f0; --blue:#2547d0; --blue-soft:#e8edfc; --navy:#1b2a4a; --ink:#1a1f2b; --ink-soft:#667085; --shot:#dfe5ef; --shot-ink:#8a96aa; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--white); font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  section { padding: 56px 24px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--blue); }
  .h1 { font-size: 40px; font-weight: 800; line-height: 1.3; letter-spacing: -.02em; margin-top: 10px; }
  .h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; }
  .p { font-size: 16px; color: var(--ink-soft); line-height: 1.7; margin-top: 10px; white-space: pre-line; }
  .center { text-align: center; }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; font-size: 15px; font-weight: 700; background: var(--blue); color: #fff; margin: 18px 8px 0 0; }
  .btn.ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
  .shot { background: var(--shot); color: var(--shot-ink); display: flex; align-items: center; justify-content: center; font-size: 13px; }

  footer { background: var(--navy); color: #c9d2e3; padding: 28px 24px; font-size: 13px; }

  .hero-bg { background: linear-gradient(180deg, #fff 0%, var(--blue-soft) 100%); }
  .hero { display: grid; grid-template-columns: 1fr 1.1fr; gap: 40px; align-items: center; }
  .devices { position: relative; height: 350px; }
  .laptop { position: absolute; right: 0; top: 50px; width: 80%; }
  .laptop .screen { border: 6px solid #11151d; border-radius: 10px 10px 0 0; height: 220px; overflow: hidden; background: #11151d; box-shadow: 0 28px 50px -22px rgba(20,32,70,.45); }
  .laptop .base { position: relative; height: 9px; background: linear-gradient(#eef1f6, #c3cad6); border-radius: 0 0 10px 10px / 0 0 7px 7px; margin: 0 -5%; box-shadow: 0 10px 18px -10px rgba(20,32,70,.4); }
  .laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 16%; height: 3px; transform: translateX(-50%); background: #aab3c2; border-radius: 0 0 4px 4px; }
  .phone { position: absolute; left: 0; top: 0; width: 36%; height: 330px; border: 5px solid #11151d; border-radius: 24px; overflow: hidden; background: #11151d; box-shadow: 0 26px 44px -18px rgba(20,32,70,.5); z-index: 1; transform: rotate(-7deg); transform-origin: 50% 100%; top: 8px; left: 6%; }
  .phone .shot, .laptop .shot { height: 100%; }


  /* 개인정보 처리방침 */
  .policy { max-width: 760px; }
  .policy h3 { font-size: 18px; margin-top: 32px; }
  .policy p, .policy li { font-size: 15px; line-height: 1.75; color: var(--ink); margin-top: 8px; }
  .policy ul { padding-left: 20px; }
  .policy table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  .policy th, .policy td { border: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; line-height: 1.6; }
  .policy th { background: var(--paper); }
  footer a { text-decoration: underline; }
  /* 서비스 화면 캡처: 있으면 회색 칸을 덮고, 없으면 글자가 그대로 보인다 */
  .shot { position: relative; overflow: hidden; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 28px; }
  .step { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid var(--line); }
  .step b { display: inline-flex; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; align-items: center; justify-content: center; }
  .step p { font-size: 15px; margin-top: 12px; line-height: 1.6; }
  .banner { background: var(--blue); color: #fff; border-radius: 16px; padding: 32px; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
  .banner .p { color: #dbe3ff; }
  .banner .btn { background: #fff; color: var(--blue); margin: 0; white-space: nowrap; }

  .info { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; border-top: 2px solid var(--navy); }
  .info > div { padding: 22px 18px; border-right: 1px solid var(--line); }
  .info > div:last-child { border-right: 0; }
  .ico { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .info h4 { font-size: 15px; margin-top: 12px; }
  .info p { font-size: 14px; color: var(--ink-soft); margin-top: 6px; line-height: 1.6; white-space: pre-line; }
  .big { font-size: 28px; font-weight: 800; color: var(--navy); margin-top: 8px; }
  .tags span { display: inline-block; font-size: 13px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 6px 13px; margin: 12px 8px 0 0; }
  .feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
  .feat div { background: var(--paper); border-radius: 12px; padding: 20px; font-size: 15px; line-height: 1.6; }
  .feat b { color: var(--blue); font-size: 12px; display: block; margin-bottom: 6px; }
  .soon { border: 1.5px dashed #b9c4d8; border-radius: 12px; padding: 28px; text-align: center; color: var(--ink-soft); font-size: 15px; margin-top: 18px; }
  /* 서비스 상세·교육 화면: 예스펀딩 구조(왼쪽 대표 화면 + 오른쪽 상황 상자 → 탭 → 고정 하단 막대) */
  .top { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
  .status { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 26px; min-width: 0; }
  .status .h1 { font-size: 30px; }
  .status .btn { margin-top: 16px; }
  .facts { display: grid; grid-template-columns: 92px 1fr; gap: 10px 14px; margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
  .facts dt { color: var(--ink-soft); }
  .facts dd { margin: 0; font-weight: 600; min-width: 0; }
  .facts .tags span { margin: 0 6px 0 0; padding: 3px 10px; }
  .big-stat { font-size: 26px; font-weight: 800; color: var(--blue); }
  .tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
  .tabbar .wrap { display: flex; gap: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
  .tabbar button { font: inherit; font-size: 15px; background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 12px 11px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .tabbar button[aria-selected="true"] { color: var(--ink); border-color: var(--blue); font-weight: 700; }
  .tabbar button:focus-visible, .bar a:focus-visible, .bar button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .panel .block + .block { margin-top: 44px; }
  .points { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
  .points li { background: var(--navy); color: #fff; border-radius: 12px; padding: 16px 18px; font-size: 15px; line-height: 1.6; }
  .points b { color: #a9bcff; margin-right: 10px; }
  .notes { margin: 14px 0 0; padding-left: 20px; }
  .notes li { font-size: 15px; line-height: 1.75; color: var(--ink); margin-top: 6px; }
  .notes a { color: var(--blue); text-decoration: underline; }
  .bar { position: sticky; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bar .btn { margin: 0; }
  .bar button.btn { font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }

  @media (max-width: 720px) {
      section { padding: 36px 16px; }
    .hero { grid-template-columns: 1fr; }
    .devices { height: 260px; order: -1; }
    .laptop .screen { height: 160px; } .laptop { top: 40px; } .phone { height: 240px; }
    .h1 { font-size: 28px; } .h2 { font-size: 22px; }

    .steps, .feat, .info { grid-template-columns: 1fr; }
    .info > div { border-right: 0; border-bottom: 1px solid var(--line); }
    .banner { flex-direction: column; align-items: flex-start; }
    .top { grid-template-columns: 1fr; }
    .top .devices { order: -1; }
    .status .h1 { font-size: 26px; }
}
/* 메인 비주얼 슬라이더 (vis-) */
.vis { background: var(--white); overflow: hidden; }
.vis-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior-x: contain; }
.vis-track::-webkit-scrollbar { display: none; }
.vis-track:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; }
.vis-slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; position: relative; min-height: clamp(560px, 78vh, 640px); display: flex; }
.vis-intro { background: linear-gradient(180deg, #fff 0%, var(--blue-soft) 100%); align-items: center; }
.vis-intro .hero { width: 100%; }
.vis-svc { background: var(--navy); color: #fff; align-items: flex-end; }
.vis-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.vis-svc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,24,50,.78) 0%, rgba(14,24,50,.45) 50%, rgba(14,24,50,.1) 100%), linear-gradient(0deg, rgba(14,24,50,.6) 0%, rgba(14,24,50,0) 55%); }
.vis-in { position: relative; z-index: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px 64px; }
.vis-acad { font-size: 14px; font-weight: 700; letter-spacing: .02em; color: #c9d6ff; }
.vis-title { font-size: 44px; font-weight: 800; line-height: 1.25; letter-spacing: -.02em; margin-top: 10px; max-width: 640px; }
.vis-line { font-size: 17px; line-height: 1.7; color: #e3e9fb; margin-top: 14px; max-width: 560px; }
.vis-more { display: inline-block; margin-top: 22px; font-size: 16px; font-weight: 700; color: #fff; text-decoration: underline; text-underline-offset: 6px; }
.vis-more:hover { color: #c9d6ff; }
.vis-more:focus-visible, .vis-ctl button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.vis-svc .vis-more:focus-visible { outline-color: #fff; }
.vis-ctl { display: flex; align-items: center; gap: 14px; max-width: 1080px; margin: 0 auto; padding: 14px 24px; }
.vis-ctl[hidden] { display: none; }
.vis-bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.vis-bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }
.vis-num { font-size: 13px; font-weight: 700; color: var(--ink-soft); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.vis-ctl button { font: inherit; font-size: 15px; cursor: pointer; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; min-width: 40px; height: 40px; padding: 0 12px; }
.vis-ctl button:hover { border-color: var(--blue); color: var(--blue); }
.vis-ctl .vis-pause { font-size: 13px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .vis-track { scroll-behavior: auto; } .vis-bar i { transition: none; } }
  @media (max-width: 720px) {
  .vis-slide { min-height: 460px; }
  .vis-in { padding: 0 16px 40px; }
  .vis-title { font-size: 30px; }
  .vis-line { font-size: 15px; }
  .vis-ctl { padding: 12px 16px; gap: 10px; }
}
  /* ===== shelf-: 구획 머리(공통) ===== */
.shelf-head { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "title"; gap: 6px 16px; align-items: end; }
  .shelf-title { grid-area: title; min-width: 0; }
  .shelf-h { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; color: var(--navy); }
  .shelf-sub { font-size: 15px; color: var(--ink-soft); line-height: 1.6; margin-top: 8px; }

.shelf-head a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 720px) {
    .shelf-h { font-size: 30px; }
.shelf-head { grid-template-areas: "title"; }

}
  /* ===== band-: HOW IT WORKS 격자 + 멤버십 띠 ===== */
  /* 구획 머리(.shelf-head)는 shelf- 담당 에이전트가 만든다. 그 CSS가 없을 때만 보이도록 :where()로 낮춘 최소 스타일 */
  :where(.shelf-head) { margin-bottom: 4px; }
  :where(.shelf-head) h2 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  :where(.shelf-head) p { font-size: 16px; color: var(--ink-soft); line-height: 1.6; margin-top: 8px; }

  .band-how { background: var(--paper); }
  .band-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(176px, auto); gap: 16px; margin-top: 32px; }
  .band-cell { position: relative; overflow: hidden; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
  .band-cell h3 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; position: relative; }
  .band-cell p { font-size: 15px; line-height: 1.65; margin-top: 8px; position: relative; }
  .band-num { position: absolute; top: 4px; right: 20px; font-size: 112px; font-weight: 800; line-height: 1; letter-spacing: -.04em; opacity: .14; pointer-events: none; }
  .band-tag { position: relative; align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-bottom: auto; }

  .band-c1 { grid-column: 1 / 6; grid-row: 1 / 3; background: var(--navy); color: #fff; }
  .band-c1 .band-num { font-size: 220px; top: 0; right: 16px; opacity: .1; }
  .band-c1 h3 { font-size: 30px; }
  .band-c1 p { color: #c9d2e3; font-size: 16px; }
  .band-c1 .band-tag { color: #a9bcff; }
  .band-c2 { grid-column: 6 / 10; background: #fff; border: 1px solid var(--line); }
  .band-c2 .band-num { color: var(--blue); }
  .band-c2 p { color: var(--ink-soft); }
  .band-c2 .band-tag { color: var(--blue); }
  .band-c3 { grid-column: 10 / 13; background: var(--blue); color: #fff; }
  .band-c3 p { color: #dbe3ff; }
  .band-c3 .band-tag { color: #dbe3ff; }
  .band-c4 { grid-column: 6 / 13; background: var(--blue-soft); flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .band-c4 > div { position: relative; min-width: 0; }
  .band-c4 .band-tag { color: var(--blue); margin-bottom: 10px; }
  .band-c4 p { color: var(--ink); max-width: 36em; }
  .band-fee { flex: none; text-align: right; position: relative; }
  .band-fee b { display: block; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--blue); }
  .band-fee span { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-soft); }

  .band-member { background: var(--navy); color: #fff; }
  .band-member-in { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }
  .band-member .eyebrow { color: #a9bcff; }
  .band-member h2 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.35; margin-top: 10px; }
  .band-member .band-lead { font-size: 16px; color: #c9d2e3; line-height: 1.7; margin-top: 12px; }
  .band-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .band-actions .btn { margin: 0; }
  .band-actions .btn.band-fill { background: #fff; color: var(--navy); }
  .band-actions .btn.band-line { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.6); padding: 10.5px 20.5px; }
  .band-actions .btn:hover { opacity: .88; }
  .band-member a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .band-perks { list-style: none; padding: 0; border-top: 1px solid rgba(255,255,255,.22); }
  .band-perks li { display: flex; gap: 18px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,.22); }
  .band-perks i { font-style: normal; font-size: 13px; font-weight: 800; color: #a9bcff; width: 22px; flex: none; }
  .band-perks b { display: block; font-size: 18px; font-weight: 700; }
  .band-perks span { display: block; font-size: 14px; color: #c9d2e3; margin-top: 4px; line-height: 1.55; }

  @media (max-width: 720px) {
    :where(.shelf-head) h2 { font-size: 28px; }
    .band-grid { grid-template-columns: 1fr; grid-auto-rows: auto; gap: 12px; margin-top: 24px; }
    .band-c1, .band-c2, .band-c3, .band-c4 { grid-column: 1; grid-row: auto; }
    .band-cell { padding: 22px; min-height: 150px; }
    .band-c1 { min-height: 220px; }
    .band-c1 .band-num { font-size: 160px; }
    .band-num { font-size: 88px; }
    .band-c4 { flex-direction: column; align-items: flex-start; }
    .band-fee { text-align: left; }
    .band-member-in { grid-template-columns: 1fr; gap: 28px; }
    .band-member h2 { font-size: 24px; }
    .band-actions .btn { flex: 1 1 auto; text-align: center; }
}
  /* ===== 푸터 (ft-) ===== */
  .ft { padding: 48px 0 28px; }
  .ft .wrap { padding: 0 24px; }
  .ft a { text-decoration: none; }
  .ft a:hover { text-decoration: underline; }
  .ft a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .ft-top { padding-bottom: 28px; border-bottom: 1px solid rgba(201,210,227,.2); }
  .ft-logo { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
  .ft-tag { margin-top: 8px; font-size: 14px; line-height: 1.6; }
  .ft-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; padding: 28px 0; }
  .ft-info { font-style: normal; font-size: 13px; line-height: 1.8; color: #aab7d1; min-width: 0; }
  .ft-info b { display: block; margin-bottom: 4px; font-size: 14px; color: #fff; }
  .ft-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px 28px; max-width: 520px; }
  .ft-links a { font-size: 14px; color: #fff; }
  .ft-links a:last-child { font-weight: 700; }
  .ft-bottom { padding-top: 20px; border-top: 1px solid rgba(201,210,227,.2); font-size: 12px; color: #aab7d1; }

  /* ===== 사이트맵 (map-) ===== */
  .map-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; margin-top: 36px; }
  .map-col { border-top: 2px solid var(--navy); padding-top: 18px; min-width: 0; }
  .map-title { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; }
  .map-list, .map-sub { list-style: none; padding: 0; margin: 0; }
  .map-list { margin-top: 14px; }
  .map-list a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; }
  .map-list a::after { content: "→"; flex: none; color: var(--ink-soft); }
  .map-list a[target="_blank"]::after { content: "↗"; }
  .map-list a:hover { color: var(--blue); }
  .map-list a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .map-sub { padding-left: 14px; }
  .map-sub a { font-size: 14px; font-weight: 500; color: var(--ink-soft); }
  .map-sub a:hover { color: var(--blue); }
  .map-wait { padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-soft); }

  @media (max-width: 720px) {
    .ft { padding: 36px 0 24px; }
    .ft .wrap { padding: 0 16px; }
    .ft-body { flex-direction: column; gap: 22px; }
    .ft-links { justify-content: flex-start; max-width: none; }
    .map-grid { grid-template-columns: 1fr; gap: 28px; margin-top: 24px; }
}

  /* 힉스필드 실사 사진·영상 (2026-11-02) */
  .vis-intro-bg::after { background: linear-gradient(90deg, rgba(14,24,50,.6) 0%, rgba(14,24,50,.3) 45%, rgba(14,24,50,0) 100%); }
  .vis-intro-bg { align-items: center; }

// ---- 메인 비주얼 슬라이더 ----
var visTimer = null, visPaused = false;
function visInfo() {
  var t = document.getElementById('vis-track');
  var n = t.children.length, w = t.clientWidth || 1;
  var i = Math.min(n - 1, Math.round(t.scrollLeft / w));
  document.getElementById('vis-num').textContent = (i + 1) + ' / ' + n;
  document.getElementById('vis-fill').style.width = ((i + 1) / n * 100) + '%';
  return { t: t, n: n, i: i, w: w };
}
function visGo(dir) {
  var v = visInfo(), to = (v.i + dir + v.n) % v.n;
  v.t.scrollTo({ left: to * v.w });
  // 작동 영상이 있는 슬라이드로 넘어가면 영상을 처음부터 다시 튼다
  var vid = v.t.children[to].querySelector('video.vis-demo');
  if (vid) { vid.currentTime = 0; vid.play().catch(function () {}); }
  return to;
}
// 지금 슬라이드에 머무는 시간: 작동 영상이 있으면 영상 길이만큼, 없으면 6초
// 넘어가는 중에는 스크롤 위치가 아직 이전 슬라이드라서, 넘어갈 슬라이드 번호(i)를 받아 계산한다
function visDelay(i) {
  var v = visInfo(), vid = v.t.children[i == null ? v.i : i].querySelector('video.vis-demo');
  return vid && vid.duration > 6 ? vid.duration * 1000 : 6000;
}
function visPlay(i) {
  clearTimeout(visTimer);
  if (visPaused || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  visTimer = setTimeout(function () { if (!document.getElementById('vis-track')) return; visPlay(visGo(1)); }, visDelay(i));
}
// 홈을 그린 직후 한 번 부른다. 첫 슬라이드는 이미 HTML에 있고, 번호·단추는 서비스 슬라이드가 붙은 뒤에 나온다
function initVisual() {
  var t = document.getElementById('vis-track'), box = t.parentNode;
  t.addEventListener('scroll', visInfo);
  document.getElementById('vis-prev').onclick = function () { visPaused = true; visGo(-1); visSync(); };
  document.getElementById('vis-next').onclick = function () { visPaused = true; visGo(1); visSync(); };
  document.getElementById('vis-pause').onclick = function () { visPaused = !visPaused; visSync(); };
  // 마우스를 올려도 계속 넘긴다(2026-11-03). 키보드로 들어오면 멈췄다가 나가면 다시 넘긴다
  box.addEventListener('focusin', function () { clearInterval(visTimer); });
  box.addEventListener('focusout', function () { visPlay(); });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { visPaused = true; document.getElementById('vis-pause').hidden = true; }
}
function visSync() {
  var b = document.getElementById('vis-pause');
  b.setAttribute('aria-pressed', visPaused);
  b.textContent = visPaused ? '재생' : '멈춤';
  visPlay();
}
// 서비스 데이터가 오면 슬라이드를 덧붙인다. 캡처가 없으면 남색 바탕만 남는다

var VIS_VIDEO = { 'S-001': 1, 'S-002': 1 };
function renderVisual(data) {
  var t = document.getElementById('vis-track');

        ? '<video class="vis-bg vis-demo" muted loop playsinline autoplay preload="metadata" poster="img/video/' + s.id + '-poster.jpg" aria-hidden="true"><source src="img/video/' + s.id + '.mp4" type="video/mp4"></video>'
        : '<img class="vis-bg" src="img/' + encodeURIComponent(s.id) + '.jpg" alt="" onerror="this.remove()">') +

}
document.addEventListener('click', function (e) {

});

    var src = 'img/video/steps/' + encodeURIComponent(s.id) + '-w' + (i + 1);
    return '<div class="detail-tour-row"><div><b>' + String(i + 1).padStart(2, '0') + '</b><h3>' + esc(item.title) + '</h3><p class="p">' + esc(item.text) + '</p>' +
      (detailFilled(item.tip) ? '<div class="detail-tip"><strong>운영자 TIP</strong><p>' + esc(item.tip) + '</p></div>' : '') +
      '</div><div class="detail-tour-media"><video muted loop playsinline preload="none" poster="' + src + '.jpg"><source src="' + src + '.mp4" type="video/mp4"></video></div></div>';
  }).join('');
  var tourHTML = tour ? '<div class="block"><div class="eyebrow">DEMO TOUR</div><div class="h2">데모 둘러보는 순서</div>' + tour + demoBtn + '</div>' : '';
  var eduHTML = extra.edu && detailFilled(extra.edu.title) && detailFilled(extra.edu.text)
    ? '<section class="detail-edu"><div class="wrap"><h2 class="h2">' + esc(extra.edu.title) + '</h2><p class="p">' + esc(extra.edu.text) + '</p><a class="btn" href="' + esc(document.querySelector('.hd-cta').href) + '" target="_blank" rel="noopener">교육 관심 등록</a><a class="btn ghost" href="?page=edu">교육 알아보기</a></div></section>' : '';

  var terms =
    '<div class="block"><div class="eyebrow">TRANSFER</div><div class="h2">넘기는 방식</div><ul class="notes">' +
      transfers.map(function (t) { return '<li><b>' + esc(t) + '</b>: ' + esc(TRANSFER[t] || '문의하시면 이용 방식과 조건을 안내합니다.') + '</li>'; }).join('') + '</ul></div>' +
    '<div class="block"><div class="eyebrow">PRICE</div><div class="h2">가격</div><div class="p">가격은 공개하지 않습니다. 문의를 남겨 주시면 운영자가 서비스를 만든 사람과 학원 사정에 맞춰 조건을 정해 안내해 드립니다.</div></div>';

  var notice =
    '<div class="block"><div class="eyebrow">CHECK</div><div class="h2">판매 전 점검</div><div class="info">' +
      '<div><div class="ico">🔒</div><h4>개인정보 처리</h4><p>' + esc(s.privacy) + '</p></div>' +
      '<div><div class="ico">©</div><h4>교재·문항 저작권</h4><p>' + esc(s.copyright) + '</p></div>' +
      '<div><div class="ico">☎</div><h4>고장 시 담당자</h4><p>' + esc(s.maintainer) + '</p></div></div></div>' +
    '<div class="block"><div class="eyebrow">NOTICE</div><div class="h2">알아 두실 점</div><ul class="notes">' +
      '<li>체험 주소는 가명·예시 데이터로만 동작합니다. 실제 학생 정보는 넣지 마세요.</li>' +
      '<li>체험 주소가 멈추면 고칠 때까지 이 전시는 잠시 비공개로 바뀝니다.</li>' +
      '<li>문의에 적어 주신 연락처는 <a href="?page=privacy">개인정보 처리방침</a>에 따라 보관하고 지웁니다.</li></ul></div>';

  document.getElementById('app').innerHTML =
    '<div class="hero-bg"><section class="wrap top">' +
      '<div class="devices"><div class="laptop"><div class="screen">' + (VIS_VIDEO[s.id] && !matchMedia('(prefers-reduced-motion: reduce)').matches ? '<video muted loop playsinline autoplay preload="metadata" poster="img/video/' + encodeURIComponent(s.id) + '-poster.jpg"><source src="img/video/' + encodeURIComponent(s.id) + '.mp4" type="video/mp4"></video>' : shot(s, '', '화면 준비 중')) + '</div><div class="base"></div></div>' +
      '<div class="phone">' + shot(s, '-m', '모바일') + '</div></div>' +
      '<div class="status"><a class="p" style="margin:0" href="./">← 서비스 목록</a>' +
        '<div class="eyebrow" style="margin-top:12px">SERVICE ' + esc(s.id) + '</div>' +
        (detailFilled(extra.hook) ? '<div class="detail-hook">' + esc(extra.hook) + '</div>' : '') +
        '<div class="h1">' + esc(s.name) + '</div><div class="p">' + esc(s.oneLiner) + '</div>' +
        '<dl class="facts">' +
          '<dt>최근 7일 조회</dt><dd><span class="big-stat">' + views + '</span>회' + (rank >= 0 ? ' · 인기 ' + (rank + 1) + '위' : '') + '</dd>' +
          '<dt>등록일</dt><dd>' + (s.registered ? fmtDate(s.registered) : '-') + '</dd>' +
          '<dt>넘기는 방식</dt><dd class="tags">' + tags + '</dd>' +
          '<dt>가격</dt><dd>문의 뒤 안내</dd>' +
          '<dt>만든 사람</dt><dd>' + esc(s.academy) + '</dd>' +
        '</dl><div>' + demoBtn + askBtn + '</div></div>' +
    '</section></div>' +
    bigq + '<section class="wrap">' + intro + compareHTML + tourHTML + detailCards(PROCESS, 'HOW IT WORKS', '도입 과정', true) + terms + faqHTML + makerHTML + registration + '</section>' + eduHTML + '<section class="wrap">' + notice + ctaHTML + '</section>' +
    '<div class="bar"><button class="btn ghost" type="button" data-copy>주소 복사</button>' + demoBtn + askBtn.replace('btn ghost', 'btn') + '</div>';
  initDetailVideos();
}

var q = new URLSearchParams(location.search);
var page = q.get('page'), id = q.get('id');
var cur = document.getElementById(page === 'edu' ? 'menu-edu' : page === 'sitemap' ? '' : 'menu-services');
if (cur) { cur.className = 'on'; cur.setAttribute('aria-current', 'page'); }
if (page === 'edu') {
  show('tpl-edu');
  // 탭 내용은 템플릿 안의 tpl-edu-intro·tpl-edu-notice에 있다
  var box = document.getElementById('edu-tabs');
  box.outerHTML = tabsHTML([['소개', document.getElementById('tpl-edu-intro').innerHTML], ['안내사항', document.getElementById('tpl-edu-notice').innerHTML]]);
  load().then(function (data) { document.getElementById('interest-count').textContent = data.interest; },
    function () { document.getElementById('interest-count').textContent = '-'; });
} else if (page === 'sitemap') {
  show('tpl-sitemap');
  load().then(renderSitemap, function () {
    document.getElementById('map-services').innerHTML = '<li class="map-wait">서비스 목록을 불러오지 못했습니다</li>';
  });
} else if (page === 'privacy') {
  show('tpl-privacy');
} else if (id) {
  document.getElementById('app').innerHTML = '<section class="detail-loading" role="status"><p class="p">서비스 정보를 불러오는 중입니다</p></section>';
  var cached = null, cachedService = null;
  try {
    // 이 서비스 저장본이 없으면 홈에서 받아 둔 전체 목록을 쓴다
    cached = JSON.parse(localStorage.getItem('tte-cache:' + id) || localStorage.getItem('tte-cache:'));
    if (cached && Array.isArray(cached.services) && Array.isArray(cached.popular)) {
      cachedService = cached.services.filter(function (s) { return s.id === id; })[0];
    }
  } catch (e) {}
  if (cachedService) renderDetail(cachedService, cached);
  load(id).then(function (data) {
    var s = data.services.filter(function (x) { return x.id === id; })[0];
    if (!s) { location.replace('./'); return; }
    if (cachedService && JSON.stringify(data) === JSON.stringify(cached)) return;
    var scrollX = window.scrollX, scrollY = window.scrollY;
    renderDetail(s, data);
    if (cachedService) {
      window.scrollTo(scrollX, scrollY);
    }
  }).catch(function () {
    if (!cachedService) document.getElementById('app').innerHTML = '<section class="detail-loading detail-error" role="alert"><p class="p">서비스 정보를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p><a class="btn ghost" href="./">← 처음으로</a></section>';
  });
} else {
  show('tpl-home'); initVisual(); jumpHash();
  // 움직임을 줄이도록 설정한 사람에게는 배경 영상을 멈춰 둔다
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('vis-video').pause();
  load().then(renderVisual, function () {}).then(jumpHash);
}
</script>
</body>
</html>
