<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하우투테크에듀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 디자인 = 06. 와이어프레임 (v0.2 디자인): 흰 바탕·코발트 블루·기기 목업 / 번호 카드 / 남색 정보 구획 */
  :root { --white:#fff; --paper:#f5f7fb; --line:#e3e8f0; --blue:#2547d0; --blue-soft:#e8edfc; --navy:#1b2a4a; --ink:#1a1f2b; --ink-soft:#667085; --shot:#dfe5ef; --shot-ink:#8a96aa; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--white); font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  section { padding: 56px 24px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--blue); }
  .h1 { font-size: 40px; font-weight: 800; line-height: 1.3; letter-spacing: -.02em; margin-top: 10px; }
  .h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; }
  .p { font-size: 16px; color: var(--ink-soft); line-height: 1.7; margin-top: 10px; white-space: pre-line; }
  .center { text-align: center; }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; font-size: 15px; font-weight: 700; background: var(--blue); color: #fff; margin: 18px 8px 0 0; }
  .btn.ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
  .shot { background: var(--shot); color: var(--shot-ink); display: flex; align-items: center; justify-content: center; font-size: 13px; }

  footer { background: var(--navy); color: #c9d2e3; padding: 28px 24px; font-size: 13px; }

  .hero-bg { background: linear-gradient(180deg, #fff 0%, var(--blue-soft) 100%); }
  .hero { display: grid; grid-template-columns: 1fr 1.1fr; gap: 40px; align-items: center; }
  .devices { position: relative; height: 300px; }
  .laptop { position: absolute; right: 0; top: 24px; width: 80%; }
  .laptop .screen { border: 9px solid #1a1f2b; border-bottom-width: 12px; border-radius: 12px 12px 0 0; height: 220px; }
  .laptop .base { height: 12px; background: #c9d0dc; border-radius: 0 0 12px 12px; margin: 0 -6%; }
  .phone { position: absolute; left: 0; top: 0; width: 30%; height: 290px; border: 8px solid #1a1f2b; border-radius: 24px; overflow: hidden; }
  .phone .shot, .laptop .shot { height: 100%; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 28px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: block; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 8px 24px rgba(37,71,208,.12); }
  .card .num { font-size: 12px; font-weight: 800; color: var(--blue); padding: 14px 16px 0; }
  .card .shot { height: 120px; margin: 10px 16px 0; border-radius: 8px; }
  .card .name { font-size: 16px; font-weight: 700; padding: 12px 16px 0; }
  .card .meta { font-size: 13px; color: var(--ink-soft); padding: 4px 16px 16px; line-height: 1.5; }
  .card.empty { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 14px; min-height: 230px; text-align: center; padding: 16px; }

  /* 실시간 인기 서비스: 왼쪽 순위 판 + 오른쪽 카드 */
  .board { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 28px; align-items: start; }
  .board .cards { grid-template-columns: repeat(3, 1fr); margin-top: 0; }
  .rank { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
  .rank-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rank-head b { font-size: 16px; }
  .rank-head span { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .rank ol { list-style: none; padding: 0; margin-top: 12px; }
  .rank li a { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 15px; }
  .rank li a:hover span { text-decoration: underline; }
  .rank li b { width: 18px; font-weight: 800; }
  .rank li span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .rank li i { font-style: normal; font-size: 11px; font-weight: 800; color: #e8462f; }
  .rank-empty { padding: 24px 0; text-align: center; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .rank-note { margin-top: 10px; font-size: 12px; color: var(--ink-soft); }

  /* 개인정보 처리방침 */
  .policy { max-width: 760px; }
  .policy h3 { font-size: 18px; margin-top: 32px; }
  .policy p, .policy li { font-size: 15px; line-height: 1.75; color: var(--ink); margin-top: 8px; }
  .policy ul { padding-left: 20px; }
  .policy table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  .policy th, .policy td { border: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; line-height: 1.6; }
  .policy th { background: var(--paper); }
  footer a { text-decoration: underline; }
  /* 서비스 화면 캡처: 있으면 회색 칸을 덮고, 없으면 글자가 그대로 보인다 */
  .shot { position: relative; overflow: hidden; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 28px; }
  .step { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid var(--line); }
  .step b { display: inline-flex; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; align-items: center; justify-content: center; }
  .step p { font-size: 15px; margin-top: 12px; line-height: 1.6; }
  .banner { background: var(--blue); color: #fff; border-radius: 16px; padding: 32px; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
  .banner .p { color: #dbe3ff; }
  .banner .btn { background: #fff; color: var(--blue); margin: 0; white-space: nowrap; }

  .info { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; border-top: 2px solid var(--navy); }
  .info > div { padding: 22px 18px; border-right: 1px solid var(--line); }
  .info > div:last-child { border-right: 0; }
  .ico { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .info h4 { font-size: 15px; margin-top: 12px; }
  .info p { font-size: 14px; color: var(--ink-soft); margin-top: 6px; line-height: 1.6; white-space: pre-line; }
  .big { font-size: 28px; font-weight: 800; color: var(--navy); margin-top: 8px; }
  .tags span { display: inline-block; font-size: 13px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 6px 13px; margin: 12px 8px 0 0; }
  .feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
  .feat div { background: var(--paper); border-radius: 12px; padding: 20px; font-size: 15px; line-height: 1.6; }
  .feat b { color: var(--blue); font-size: 12px; display: block; margin-bottom: 6px; }
  .soon { border: 1.5px dashed #b9c4d8; border-radius: 12px; padding: 28px; text-align: center; color: var(--ink-soft); font-size: 15px; margin-top: 18px; }
  /* 서비스 상세·교육 화면: 예스펀딩 구조(왼쪽 대표 화면 + 오른쪽 상황 상자 → 탭 → 고정 하단 막대) */
  .top { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
  .status { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 26px; min-width: 0; }
  .status .h1 { font-size: 30px; }
  .status .btn { margin-top: 16px; }
  .facts { display: grid; grid-template-columns: 92px 1fr; gap: 10px 14px; margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
  .facts dt { color: var(--ink-soft); }
  .facts dd { margin: 0; font-weight: 600; min-width: 0; }
  .facts .tags span { margin: 0 6px 0 0; padding: 3px 10px; }
  .big-stat { font-size: 26px; font-weight: 800; color: var(--blue); }
  .tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
  .tabbar .wrap { display: flex; gap: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
  .tabbar button { font: inherit; font-size: 15px; background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 12px 11px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .tabbar button[aria-selected="true"] { color: var(--ink); border-color: var(--blue); font-weight: 700; }
  .tabbar button:focus-visible, .bar a:focus-visible, .bar button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .panel .block + .block { margin-top: 44px; }
  .points { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
  .points li { background: var(--navy); color: #fff; border-radius: 12px; padding: 16px 18px; font-size: 15px; line-height: 1.6; }
  .points b { color: #a9bcff; margin-right: 10px; }
  .screens { display: grid; grid-template-columns: 3fr 1fr; gap: 16px; margin-top: 20px; align-items: start; }
  .screens img { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; }
  .notes { margin: 14px 0 0; padding-left: 20px; }
  .notes li { font-size: 15px; line-height: 1.75; color: var(--ink); margin-top: 6px; }
  .notes a { color: var(--blue); text-decoration: underline; }
  .bar { position: sticky; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bar .btn { margin: 0; }
  .bar button.btn { font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }

  @media (max-width: 720px) {
      section { padding: 36px 16px; }
    .hero { grid-template-columns: 1fr; }
    .devices { height: 220px; order: -1; }
    .laptop .screen { height: 160px; } .phone { height: 210px; }
    .h1 { font-size: 28px; } .h2 { font-size: 22px; }
    .cards, .board .cards { grid-template-columns: 1fr 1fr; }
    .board { grid-template-columns: 1fr; }
    .card.empty { display: none; }
    .steps, .feat, .info { grid-template-columns: 1fr; }
    .info > div { border-right: 0; border-bottom: 1px solid var(--line); }
    .banner { flex-direction: column; align-items: flex-start; }
    .top, .screens { grid-template-columns: 1fr; }
    .top .devices { order: -1; }
    .status .h1 { font-size: 26px; }
  }
/* 메인 비주얼 슬라이더 (vis-) */
.vis { background: var(--white); overflow: hidden; }
.vis-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior-x: contain; }
.vis-track::-webkit-scrollbar { display: none; }
.vis-track:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; }
.vis-slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; position: relative; min-height: clamp(560px, 78vh, 640px); display: flex; }
.vis-intro { background: linear-gradient(180deg, #fff 0%, var(--blue-soft) 100%); align-items: center; }
.vis-intro .hero { width: 100%; }
.vis-svc { background: var(--navy); color: #fff; align-items: flex-end; }
.vis-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.vis-svc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,24,50,.94) 0%, rgba(14,24,50,.78) 50%, rgba(14,24,50,.35) 100%), linear-gradient(0deg, rgba(14,24,50,.75) 0%, rgba(14,24,50,0) 55%); }
.vis-in { position: relative; z-index: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px 64px; }
.vis-acad { font-size: 14px; font-weight: 700; letter-spacing: .02em; color: #c9d6ff; }
.vis-title { font-size: 44px; font-weight: 800; line-height: 1.25; letter-spacing: -.02em; margin-top: 10px; max-width: 640px; }
.vis-line { font-size: 17px; line-height: 1.7; color: #e3e9fb; margin-top: 14px; max-width: 560px; }
.vis-more { display: inline-block; margin-top: 22px; font-size: 16px; font-weight: 700; color: #fff; text-decoration: underline; text-underline-offset: 6px; }
.vis-more:hover { color: #c9d6ff; }
.vis-more:focus-visible, .vis-ctl button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.vis-svc .vis-more:focus-visible { outline-color: #fff; }
.vis-ctl { display: flex; align-items: center; gap: 14px; max-width: 1080px; margin: 0 auto; padding: 14px 24px; }
.vis-ctl[hidden] { display: none; }
.vis-bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.vis-bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }
.vis-num { font-size: 13px; font-weight: 700; color: var(--ink-soft); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.vis-ctl button { font: inherit; font-size: 15px; cursor: pointer; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; min-width: 40px; height: 40px; padding: 0 12px; }
.vis-ctl button:hover { border-color: var(--blue); color: var(--blue); }
.vis-ctl .vis-pause { font-size: 13px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .vis-track { scroll-behavior: auto; } .vis-bar i { transition: none; } }
@media (max-width: 720px) {
  .vis-slide { min-height: 460px; }
  .vis-in { padding: 0 16px 40px; }
  .vis-title { font-size: 30px; }
  .vis-line { font-size: 15px; }
  .vis-ctl { padding: 12px 16px; gap: 10px; }
}
  /* ===== shelf-: 구획 머리(공통) + 가로로 넘기는 카드 줄 ===== */
  .shelf-head { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "title more" "tabs tabs"; gap: 6px 16px; align-items: end; }
  .shelf-title { grid-area: title; min-width: 0; }
  .shelf-h { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; color: var(--navy); }
  .shelf-sub { font-size: 15px; color: var(--ink-soft); line-height: 1.6; margin-top: 8px; }
  .shelf-more { grid-area: more; font-size: 14px; font-weight: 700; color: var(--ink); border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; white-space: nowrap; }
  .shelf-more:hover { color: var(--blue); border-color: var(--blue); }
  .shelf-tabs { grid-area: tabs; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .shelf-tabs button { font: inherit; font-size: 14px; font-weight: 600; background: #fff; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; cursor: pointer; }
  .shelf-tabs button:hover { border-color: var(--navy); color: var(--ink); }
  .shelf-tabs button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .shelf-head a:focus-visible, .shelf-tabs button:focus-visible, .shelf-bar button:focus-visible, .shelf-track:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .shelf-main { min-width: 0; }
  .shelf-track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px 2px 6px; }
  .shelf-track::-webkit-scrollbar { display: none; }
  .shelf-track > .card, .shelf-track > .card.empty { flex: 0 0 calc((100% - 32px) / 3); scroll-snap-align: start; min-width: 0; }
  .shelf-empty { flex: 1 0 100%; border: 1.5px dashed #b9c4d8; border-radius: 12px; padding: 48px 20px; text-align: center; color: var(--ink-soft); font-size: 14px; line-height: 1.7; }
  .shelf-bar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .shelf-bar[hidden] { display: none; }
  .shelf-prog { flex: 1; height: 3px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
  .shelf-prog i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: var(--navy); border-radius: 2px; }
  .shelf-bar button { font: inherit; font-size: 18px; line-height: 1; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .shelf-bar button:hover { border-color: var(--navy); }
  @media (max-width: 720px) {
    .shelf-h { font-size: 30px; }
    .shelf-head { grid-template-areas: "title title" "more more" "tabs tabs"; }
    .shelf-more { justify-self: start; margin-top: 4px; }
    .shelf-track > .card, .shelf-track > .card.empty { flex-basis: 72%; }
    .shelf-track > .card.empty { display: flex; }
  }
  /* ===== band-: HOW IT WORKS 격자 + 멤버십 띠 ===== */
  /* 구획 머리(.shelf-head)는 shelf- 담당 에이전트가 만든다. 그 CSS가 없을 때만 보이도록 :where()로 낮춘 최소 스타일 */
  :where(.shelf-head) { margin-bottom: 4px; }
  :where(.shelf-head) h2 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  :where(.shelf-head) p { font-size: 16px; color: var(--ink-soft); line-height: 1.6; margin-top: 8px; }

  .band-how { background: var(--paper); }
  .band-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(176px, auto); gap: 16px; margin-top: 32px; }
  .band-cell { position: relative; overflow: hidden; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
  .band-cell h3 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.3; position: relative; }
  .band-cell p { font-size: 15px; line-height: 1.65; margin-top: 8px; position: relative; }
  .band-num { position: absolute; top: 4px; right: 20px; font-size: 112px; font-weight: 800; line-height: 1; letter-spacing: -.04em; opacity: .14; pointer-events: none; }
  .band-tag { position: relative; align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-bottom: auto; }

  .band-c1 { grid-column: 1 / 6; grid-row: 1 / 3; background: var(--navy); color: #fff; }
  .band-c1 .band-num { font-size: 220px; top: 0; right: 16px; opacity: .1; }
  .band-c1 h3 { font-size: 30px; }
  .band-c1 p { color: #c9d2e3; font-size: 16px; }
  .band-c1 .band-tag { color: #a9bcff; }
  .band-c2 { grid-column: 6 / 10; background: #fff; border: 1px solid var(--line); }
  .band-c2 .band-num { color: var(--blue); }
  .band-c2 p { color: var(--ink-soft); }
  .band-c2 .band-tag { color: var(--blue); }
  .band-c3 { grid-column: 10 / 13; background: var(--blue); color: #fff; }
  .band-c3 p { color: #dbe3ff; }
  .band-c3 .band-tag { color: #dbe3ff; }
  .band-c4 { grid-column: 6 / 13; background: var(--blue-soft); flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .band-c4 > div { position: relative; min-width: 0; }
  .band-c4 .band-tag { color: var(--blue); margin-bottom: 10px; }
  .band-c4 p { color: var(--ink); max-width: 36em; }
  .band-fee { flex: none; text-align: right; position: relative; }
  .band-fee b { display: block; font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--blue); }
  .band-fee span { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-soft); }

  .band-member { background: var(--navy); color: #fff; }
  .band-member-in { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }
  .band-member .eyebrow { color: #a9bcff; }
  .band-member h2 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.35; margin-top: 10px; }
  .band-member .band-lead { font-size: 16px; color: #c9d2e3; line-height: 1.7; margin-top: 12px; }
  .band-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .band-actions .btn { margin: 0; }
  .band-actions .btn.band-fill { background: #fff; color: var(--navy); }
  .band-actions .btn.band-line { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.6); padding: 10.5px 20.5px; }
  .band-actions .btn:hover { opacity: .88; }
  .band-member a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    </table>
    <p>전시 페이지를 둘러볼 때는 개인정보를 받지 않습니다. 인기 순위를 매기려고 서비스 상세 페이지를 연 시각과 서비스 번호만 남기며, 이 기록은 7일 뒤 지웁니다.</p>

    <h3>2. 보관 기간</h3>
    <ul>
      <li>서비스 문의: 문의한 날부터 6개월. 거래가 성사되면 거래가 끝날 때까지</li>
      <li>교육 관심 등록: 등록한 날부터 1년</li>

    </ul>
    <p>본인이 원하시면 기간이 남아 있어도 바로 지웁니다.</p>

    <h3>3. 지우는 방법</h3>
    <p>보관 기간이 지나면 운영 시트와 설문지 응답 기록에서 해당 내용을 지체 없이 지웁니다. 운영자는 매일 점검으로 기간이 지난 연락처를 확인합니다.</p>

    <h3>4. 다른 사람에게 주는지</h3>
    <p>받은 개인정보를 다른 사람에게 주지 않습니다. 거래를 위해 서비스를 만든 사람에게 연락처를 알려야 할 때는 미리 본인 동의를 받습니다.</p>

    <h3>5. 보관을 맡기는 곳(국외 보관 포함)</h3>
    <p>설문지 응답과 운영 기록은 구글(Google LLC)의 설문지·스프레드시트 서비스에 저장됩니다. 구글의 서버는 미국 등 국외에 있을 수 있으며, 제출하시는 순간 인터넷으로 옮겨져 위 보관 기간 동안 저장됩니다. 옮기는 항목은 1번 표의 항목과 같습니다. 국외 보관을 원하지 않으시면 설문지를 제출하지 않으시면 되며, 이 경우 문의나 관심 등록을 받을 수 없습니다.</p>
    <p>문의·관심 등록이 들어오면 운영자에게 카카오톡 알림이 가지만, 알림에는 연락처 등 개인정보를 넣지 않습니다.</p>

    <h3>6. 본인의 권리</h3>
    <p>언제든지 내 개인정보를 열람하거나 고쳐 달라고, 지워 달라고, 처리를 멈춰 달라고 요구하실 수 있습니다. 아래 연락처로 알려 주시면 지체 없이 처리합니다.</p>

    <h3>7. 안전하게 지키는 방법</h3>
    <ul>
      <li>운영 시트는 운영자 계정 한 명만 열 수 있습니다.</li>
      <li>연락처·이메일은 전시 페이지에 나가지 않습니다.</li>

<script>
// 데이터는 운영 시트에 있고, 앱스 스크립트(02_전시_웹앱.gs의 api_)가 공개용 칸만 JSON으로 돌려준다.
var API = 'https://script.google.com/macros/s/AKfycbzS_tcVvEJ7-KHMaHBR8Z9vJcA_HYlZsCtwOpP8Erp6e73-lCD47os8NdPv-PGbLn0yMA/exec';
var INQUIRY = 'https://docs.google.com/forms/d/e/1FAIpQLScaxYxQOKpxdIRWhajW2e3Y0oQWpqp04gIBOb-ZqmPkEpK-kg/viewform?usp=pp_url&entry.386988050=';

// 등록자가 적은 글을 화면에 넣기 전에 HTML로 해석되지 않게 바꾼다
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// 서비스 화면 캡처는 img/서비스ID.jpg(데스크톱), img/서비스ID-m.jpg(휴대폰)에 둔다. 파일이 없으면 이미지를 지우고 글자만 남긴다
function shot(s, suffix, label) {
  return '<div class="shot">' + label + '<img src="img/' + encodeURIComponent(s.id) + suffix + '.jpg" alt="' + esc(s.name) + ' 화면" loading="lazy" onerror="this.remove()"></div>';
}
function splitItems(text) {
  return String(text || '').split(/\n|\s\/\s/).map(function (x) { return x.trim(); }).filter(String);
}
function load(view) {
  return fetch(API + '?api=1' + (view ? '&view=' + encodeURIComponent(view) : '')).then(function (r) { return r.json(); });
}
function show(id) {
  document.getElementById('app').innerHTML = document.getElementById(id).innerHTML;
}

// ---- 메인 비주얼 슬라이더 ----
var visTimer = null, visPaused = false;
function visInfo() {
  var t = document.getElementById('vis-track');
  var n = t.children.length, w = t.clientWidth || 1;
  var i = Math.min(n - 1, Math.round(t.scrollLeft / w));
  document.getElementById('vis-num').textContent = (i + 1) + ' / ' + n;
  document.getElementById('vis-fill').style.width = ((i + 1) / n * 100) + '%';
  return { t: t, n: n, i: i, w: w };
}
function visGo(dir) {
  var v = visInfo(), to = (v.i + dir + v.n) % v.n;
  v.t.scrollTo({ left: to * v.w });
}
function visPlay() {
  clearInterval(visTimer);
  if (visPaused || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  visTimer = setInterval(function () { if (document.getElementById('vis-track')) visGo(1); else clearInterval(visTimer); }, 6000);
}
// 홈을 그린 직후 한 번 부른다. 첫 슬라이드는 이미 HTML에 있고, 번호·단추는 서비스 슬라이드가 붙은 뒤에 나온다
function initVisual() {
  var t = document.getElementById('vis-track'), box = t.parentNode;
  t.addEventListener('scroll', visInfo);
  document.getElementById('vis-prev').onclick = function () { visPaused = true; visGo(-1); visSync(); };
  document.getElementById('vis-next').onclick = function () { visPaused = true; visGo(1); visSync(); };
  document.getElementById('vis-pause').onclick = function () { visPaused = !visPaused; visSync(); };
  // 마우스를 올려도 계속 넘긴다(2026-11-03). 키보드로 들어오면 멈췄다가 나가면 다시 넘긴다
  box.addEventListener('focusin', function () { clearInterval(visTimer); });
  box.addEventListener('focusout', visPlay);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { visPaused = true; document.getElementById('vis-pause').hidden = true; }
}
function visSync() {
  var b = document.getElementById('vis-pause');
  b.setAttribute('aria-pressed', visPaused);
  b.textContent = visPaused ? '재생' : '멈춤';
  visPlay();
}
// 서비스 데이터가 오면 슬라이드를 덧붙인다. 캡처가 없으면 남색 바탕만 남는다
function renderVisual(data) {
  var t = document.getElementById('vis-track');
  if (!t || !data.services.length) return;
  var total = data.services.length + 1;
  t.insertAdjacentHTML('beforeend', data.services.map(function (s, i) {
    return '<div class="vis-slide vis-svc" role="group" aria-roledescription="slide" aria-label="' + (i + 2) + ' / ' + total + '">' +
      '<img class="vis-bg" src="img/' + encodeURIComponent(s.id) + '.jpg" alt="" onerror="this.remove()">' +
      '<div class="vis-in"><div class="vis-acad">' + esc(s.academy) + '</div>' +
      '<div class="vis-title">' + esc(s.name) + '</div><div class="vis-line">' + esc(s.oneLiner) + '</div>' +
      '<a class="vis-more" href="?id=' + encodeURIComponent(s.id) + '">서비스 자세히 보기</a></div></div>';
  }).join(''));
  document.getElementById('vis-ctl').hidden = false;
  visInfo(); visSync();
}
// 서비스 카드 줄: 상태(목록·넘기는 방식·검색어)를 한 곳에 두고, 바뀔 때마다 shelfDraw로 다시 그린다
var shelfState = { list: [], transfer: '', keyword: '' };
// 순수 거르기 함수. transfer가 빈 글자면 전체, keyword가 빈 글자면 검색어 없음
function shelfFilter(list, keyword, transfer) {
  var k = String(keyword || '').trim().toLowerCase();
  return list.filter(function (s) {
    var tr = String(s.transfer || '').split(',').map(function (t) { return t.trim(); });
    var hay = [s.name, s.oneLiner, s.academy, s.problem].join(' ').toLowerCase();
    return (!transfer || tr.indexOf(transfer) >= 0) && (!k || hay.indexOf(k) >= 0);
  });
}
function shelfCard(s) {
  var n = ('0' + (shelfState.list.indexOf(s) + 1)).slice(-2);
  return '<a class="card" href="?id=' + encodeURIComponent(s.id) + '"><div class="num">' + n + '</div>' +
    shot(s, '', '화면 준비 중') + '<div class="name">' + esc(s.name) + '</div><div class="meta">' + esc(s.oneLiner) + '<br>' + esc(s.academy) + '</div></a>';
}
// 진행 막대: 보이는 폭 / 전체 폭 = 막대 길이, 스크롤 위치 = 막대 위치. 넘치지 않으면 막대와 단추를 숨긴다
function shelfProgress() {
  var t = document.getElementById('shelf-track'), bar = document.getElementById('shelf-bar'), th = document.getElementById('shelf-thumb');
  if (!t || !bar || !th) return;
  var over = t.scrollWidth > t.clientWidth + 2;
  bar.hidden = !over;
  if (!over) return;
  var w = t.clientWidth / t.scrollWidth, max = t.scrollWidth - t.clientWidth;
  th.style.width = (w * 100) + '%';
  th.style.left = ((1 - w) * 100 * (t.scrollLeft / max)) + '%';
}
function shelfDraw() {
  var t = document.getElementById('shelf-track');
  if (!t) return;
  var rows = shelfFilter(shelfState.list, shelfState.keyword, shelfState.transfer), html = rows.map(shelfCard).join('');
  if (!rows.length) {
    html = '<div class="shelf-empty">' + (shelfState.keyword
      ? '찾으시는 서비스가 없습니다.<br>다른 말로 찾아보거나 전체 보기를 눌러 주세요.'
      : '이 방식으로 넘기는 서비스는 아직 없습니다.<br>다른 탭을 눌러 보세요.') + '</div>';
  } else if (!shelfState.transfer && !shelfState.keyword && rows.length < 3) {
    html += '<div class="card empty">곧 더 많은 서비스가<br>올라옵니다</div>';
  }
  t.innerHTML = html;
  t.scrollLeft = 0;
  document.querySelectorAll('.shelf-tabs [data-shelf]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.shelf === shelfState.transfer); });
  shelfProgress();
}
// 바깥(탭 클릭, 찾기 막대)에서 부르는 입구. 넘긴 칸만 바뀐다: shelfSet({transfer:'사용권'}), shelfSet({keyword:'학부모'})
function shelfSet(patch) {
  if (patch.transfer != null) shelfState.transfer = patch.transfer;
  if (patch.keyword != null) shelfState.keyword = patch.keyword;
  shelfDraw();
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-shelf]');
  if (b) shelfSet({ transfer: b.dataset.shelf });   // 「전체 보기」 링크는 data-shelf="" 이므로 전체로 돌아가며 #services로 이동
  var g = e.target.closest('[data-shelf-go]');
  var t = document.getElementById('shelf-track');
  if (g && t) t.scrollBy({ left: t.clientWidth * 0.8 * Number(g.dataset.shelfGo), behavior: 'smooth' });
});
window.addEventListener('resize', shelfProgress);
function renderBoard(data) {
  var rank = data.popular.length
    ? '<ol>' + data.popular.map(function (r, i) {
        return '<li><a href="?id=' + encodeURIComponent(r.id) + '"><b>' + (i + 1) + '</b><span>' + esc(r.name) + '</span>' + (r.isNew ? '<i>N</i>' : '') + '</a></li>';
      }).join('') + '</ol>'
    : '<div class="rank-empty">공개된 서비스가 생기면<br>순위가 나옵니다</div>';
  shelfState.list = data.services;
  document.getElementById('board').innerHTML =
    '<aside class="rank"><div class="rank-head"><b>실시간 인기 서비스</b><span>오늘 ' + esc(data.updated) + ' 기준</span></div>' + rank +
    '<div class="rank-note">최근 7일 조회 수 기준</div></aside>' +
    '<div class="shelf-main"><div class="shelf-track" id="shelf-track" tabindex="0" role="region" aria-label="서비스 카드 목록"></div>' +
    '<div class="shelf-bar" id="shelf-bar" hidden><div class="shelf-prog"><i id="shelf-thumb"></i></div>' +
    '<button type="button" data-shelf-go="-1" aria-label="이전 카드">‹</button><button type="button" data-shelf-go="1" aria-label="다음 카드">›</button></div></div>';
  shelfDraw();
  document.getElementById('shelf-track').addEventListener('scroll', shelfProgress, { passive: true });
}

function renderSitemap(data) {
  document.getElementById('map-services').innerHTML = data.services.length
    ? data.services.map(function (s) { return '<li><a href="?id=' + encodeURIComponent(s.id) + '">' + esc(s.name) + '</a></li>'; }).join('')
    : '<li class="map-wait">공개된 서비스가 생기면 여기에 나옵니다</li>';
}
// 다른 화면에서 ./#services 처럼 들어오면, 화면이 그려진 뒤에 그 구획으로 내려간다
function jumpHash() {
  var t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (t) t.scrollIntoView();
}
var ORDINAL = ['첫 번째', '두 번째', '세 번째', '네 번째', '다섯 번째', '여섯 번째', '일곱 번째', '여덟 번째', '아홉 번째', '열 번째'];
var TRANSFER = { '사용권': '매달 이용료를 내고 그대로 씁니다.', '설치 대행': '구매한 학원에 맞게 만든 사람이 설치해 드립니다.', '소스 판매': '화면 파일과 코드를 넘겨받아 직접 고쳐 씁니다.' };
function fmtDate(t) { var d = new Date(t); return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.'; }
// 탭 이름과 각 탭 내용(HTML)을 받아 탭 막대와 내용 칸을 만든다. 첫 탭이 열린 채로 시작한다
function tabsHTML(list) {
  return '<nav class="tabbar" aria-label="상세 내용"><div class="wrap" role="tablist">' +
    list.map(function (t, i) { return '<button role="tab" data-tab="' + i + '" aria-selected="' + (i === 0) + '">' + t[0] + '</button>'; }).join('') + '</div></nav>' +
    list.map(function (t, i) { return '<section class="wrap panel" data-panel="' + i + '"' + (i ? ' hidden' : '') + '>' + t[1] + '</section>'; }).join('');
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab]');
  if (b) {
    document.querySelectorAll('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', x === b); });
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.dataset.panel !== b.dataset.tab; });
    document.querySelector('.tabbar').scrollIntoView();
  }
  var c = e.target.closest('[data-copy]');
  if (c) navigator.clipboard.writeText(location.href).then(function () { c.textContent = '주소를 복사했습니다'; }, function () { c.textContent = '주소창의 주소를 복사해 주세요'; });
});

function renderDetail(s, data) {
  var ask = INQUIRY + encodeURIComponent(s.id);
  var rank = data.popular.map(function (r) { return r.id; }).indexOf(s.id);
  var views = rank < 0 ? 0 : data.popular[rank].views;
  var transfers = s.transfer.split(',').map(function (t) { return t.trim(); }).filter(String);
  var tags = transfers.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
  var feats = splitItems(s.features).map(function (f, i) { return '<li><b>' + (ORDINAL[i] || (i + 1) + '번째') + '</b>' + esc(f) + '</li>'; }).join('');
  var demoBtn = s.demo ? '<a class="btn" href="' + esc(s.demo) + '" target="_blank" rel="noopener">체험해 보기</a>' : '';
  var askBtn = '<a class="btn ghost" href="' + esc(ask) + '" target="_blank" rel="noopener">문의하기</a>';

  var intro =
    '<div class="block"><div class="eyebrow">PROBLEM</div><div class="h2">해결하는 문제와 쓰는 사람</div><div class="p">' + esc(s.problem) + '</div></div>' +
    '<div class="block"><div class="eyebrow">FEATURES</div><div class="h2">이 서비스로 할 수 있는 일</div><ol class="points">' + feats + '</ol></div>' +
    '<div class="block"><div class="eyebrow">SCREEN</div><div class="h2">실제 화면</div><div class="screens">' +
      '<img src="img/' + encodeURIComponent(s.id) + '.jpg" alt="' + esc(s.name) + ' 데스크톱 화면" loading="lazy" onerror="this.remove()">' +
      '<img src="img/' + encodeURIComponent(s.id) + '-m.jpg" alt="' + esc(s.name) + ' 휴대폰 화면" loading="lazy" onerror="this.remove()"></div></div>' +
    '<div class="block"><div class="eyebrow">RESULT</div><div class="h2">실제로 써 본 결과</div><div class="info">' +
      '<div><div class="ico">◷</div><h4>사용 기간</h4><div class="big">' + esc(s.period) + '</div></div>' +
      '<div><div class="ico">◉</div><h4>쓴 사람</h4><div class="big">' + esc(s.users) + '</div></div>' +
      '<div><div class="ico">✎</div><h4>써 보고 고친 것</h4><p>' + esc(s.fixes) + '</p></div></div></div>' +
    '<div class="block"><div class="eyebrow">MAKER</div><div class="h2">만든 사람</div><div class="p">' + esc(s.academy) + '</div></div>';

  var terms =
    '<div class="block"><div class="eyebrow">TRANSFER</div><div class="h2">넘기는 방식</div><ul class="notes">' +
      transfers.map(function (t) { return '<li><b>' + esc(t) + '</b>: ' + esc(TRANSFER[t] || '문의하시면 자세히 안내해 드립니다.') + '</li>'; }).join('') + '</ul></div>' +
    '<div class="block"><div class="eyebrow">PRICE</div><div class="h2">가격</div><div class="p">가격은 공개하지 않습니다. 문의를 남기시면 운영자가 만든 사람과 학원 사정에 맞춰 정한 뒤 안내해 드립니다.</div></div>' +
    '<div class="block"><div class="eyebrow">HOW IT WORKS</div><div class="h2">진행 순서</div><div class="steps">' +
      '<div class="step"><b>1</b><p>체험 주소로<br>직접 써 봅니다</p></div>' +
      '<div class="step"><b>2</b><p>문의를 남깁니다</p></div>' +
      '<div class="step"><b>3</b><p>운영자가 만든 사람과<br>조건을 정해 안내합니다</p></div></div></div>';

  var notice =
    '<div class="block"><div class="eyebrow">CHECK</div><div class="h2">판매 전 점검</div><div class="info">' +
      '<div><div class="ico">🔒</div><h4>개인정보 처리</h4><p>' + esc(s.privacy) + '</p></div>' +
      '<div><div class="ico">©</div><h4>교재·문항 저작권</h4><p>' + esc(s.copyright) + '</p></div>' +
      '<div><div class="ico">☎</div><h4>고장 시 담당자</h4><p>' + esc(s.maintainer) + '</p></div></div></div>' +
    '<div class="block"><div class="eyebrow">NOTICE</div><div class="h2">알아 두실 점</div><ul class="notes">' +
      '<li>체험 주소는 가명·예시 데이터로만 동작합니다. 실제 학생 정보를 넣지 마세요.</li>' +
      '<li>체험 주소가 멈추면 고칠 때까지 이 전시가 잠시 비공개로 바뀝니다.</li>' +
      '<li>문의에 적어 주신 연락처는 <a href="?page=privacy">개인정보 처리방침</a>에 따라 보관하고 지웁니다.</li></ul></div>';

  document.getElementById('app').innerHTML =
    '<div class="hero-bg"><section class="wrap top">' +
      '<div class="devices"><div class="laptop"><div class="screen">' + shot(s, '', '화면 준비 중') + '</div><div class="base"></div></div>' +
      '<div class="phone">' + shot(s, '-m', '모바일') + '</div></div>' +
      '<div class="status"><a class="p" style="margin:0" href="./">← 서비스 목록</a>' +
        '<div class="eyebrow" style="margin-top:12px">SERVICE ' + esc(s.id) + '</div>' +
        '<div class="h1">' + esc(s.name) + '</div><div class="p">' + esc(s.oneLiner) + '</div>' +
        '<dl class="facts">' +
          '<dt>최근 7일 조회</dt><dd><span class="big-stat">' + views + '</span>회' + (rank >= 0 ? ' · 인기 ' + (rank + 1) + '위' : '') + '</dd>' +
          '<dt>등록일</dt><dd>' + (s.registered ? fmtDate(s.registered) : '-') + '</dd>' +
          '<dt>넘기는 방식</dt><dd class="tags">' + tags + '</dd>' +
          '<dt>가격</dt><dd>문의 뒤 안내</dd>' +
          '<dt>만든 사람</dt><dd>' + esc(s.academy) + '</dd>' +
        '</dl><div>' + demoBtn + askBtn + '</div></div>' +
    '</section></div>' +
    tabsHTML([['소개', intro], ['이용 조건', terms], ['안내사항', notice]]) +
    '<div class="bar"><button class="btn ghost" type="button" data-copy>주소 복사</button>' + demoBtn + askBtn.replace('btn ghost', 'btn') + '</div>';
}

// 서비스 찾기 막대: 진열 탭과 같은 거르기 상태(shelfSet)를 바꾸고, 결과 수를 알린다
function initFind() {
  var q = document.getElementById('find-q'), t = document.getElementById('find-t'), msg = document.getElementById('find-msg');
  function run() {
    shelfSet({ keyword: q.value, transfer: t.value });
    if (!q.value.trim() && !t.value) { msg.innerHTML = ''; return; }
    var n = shelfFilter(shelfState.list, q.value, t.value).length;
    var reset = '<button type="button" class="find-reset">모두 보기</button>';
    msg.innerHTML = n
      ? '서비스 ' + shelfState.list.length + '개 중 <b>' + n + '개</b>를 찾았습니다.' + reset
      : '맞는 서비스가 아직 없습니다. 검색어를 줄이거나 넘기는 방식을 「전체」로 바꿔 보세요. 찾는 서비스가 없다면 <a href="?page=edu">직접 만들어 보는 과정</a>도 있습니다.' + reset;
  }
  q.addEventListener('input', run);
  t.addEventListener('change', run);
  document.getElementById('find').addEventListener('submit', function () { run(); document.getElementById('services').scrollIntoView(); });
  msg.addEventListener('click', function (e) {
    if (!e.target.closest('.find-reset')) return;
    q.value = ''; t.value = ''; run(); q.focus();
  });
  // 진열 탭을 누르면 찾기 막대의 넘기는 방식도 같은 값으로 맞춘다
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-shelf]'); if (b) { t.value = b.dataset.shelf; if (!q.value.trim()) msg.innerHTML = ''; } });
}
var q = new URLSearchParams(location.search);
var page = q.get('page'), id = q.get('id');
var cur = document.getElementById(page === 'edu' ? 'menu-edu' : page === 'sitemap' ? '' : 'menu-services');
if (cur) { cur.className = 'on'; cur.setAttribute('aria-current', 'page'); }
if (page === 'edu') {
  show('tpl-edu');
  // 탭 내용은 템플릿 안의 tpl-edu-intro·tpl-edu-notice에 있다
  var box = document.getElementById('edu-tabs');
  box.outerHTML = tabsHTML([['소개', document.getElementById('tpl-edu-intro').innerHTML], ['안내사항', document.getElementById('tpl-edu-notice').innerHTML]]);
  load().then(function (data) { document.getElementById('interest-count').textContent = data.interest; },
    function () { document.getElementById('interest-count').textContent = '-'; });
} else if (page === 'sitemap') {
  show('tpl-sitemap');
  load().then(renderSitemap, function () {
    document.getElementById('map-services').innerHTML = '<li class="map-wait">서비스 목록을 불러오지 못했습니다</li>';
  });
} else if (page === 'privacy') {
  show('tpl-privacy');
} else if (id) {
  load(id).then(function (data) {
    var s = data.services.filter(function (x) { return x.id === id; })[0];
    if (s) renderDetail(s, data); else location.replace('./');
  });
} else {
  show('tpl-home'); initVisual(); initFind(); jumpHash();
  // 움직임을 줄이도록 설정한 사람에게는 배경 영상을 멈춰 둔다
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('vis-video').pause();
  load().then(function (data) { renderBoard(data); renderVisual(data); }, function () {
    document.getElementById('board').innerHTML = '<div class="rank"><div class="rank-empty">서비스 목록을 불러오지 못했습니다.<br>잠시 뒤 다시 열어 주세요.</div></div>';
  }).then(jumpHash);
}
</script>
</body>
</html>
