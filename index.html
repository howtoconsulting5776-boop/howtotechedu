<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하우투테크에듀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 디자인 = 06. 와이어프레임 (v0.2 디자인): 흰 바탕·코발트 블루·기기 목업 / 번호 카드 / 남색 정보 구획 */
  :root { --white:#fff; --paper:#f5f7fb; --line:#e3e8f0; --blue:#2547d0; --blue-soft:#e8edfc; --navy:#1b2a4a; --ink:#1a1f2b; --ink-soft:#667085; --shot:#dfe5ef; --shot-ink:#8a96aa; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--white); font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  section { padding: 56px 24px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--blue); }
  .h1 { font-size: 40px; font-weight: 800; line-height: 1.3; letter-spacing: -.02em; margin-top: 10px; }
  .h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; }
  .p { font-size: 16px; color: var(--ink-soft); line-height: 1.7; margin-top: 10px; white-space: pre-line; }
  .center { text-align: center; }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; font-size: 15px; font-weight: 700; background: var(--blue); color: #fff; margin: 18px 8px 0 0; }
  .btn.ghost { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
  .shot { background: var(--shot); color: var(--shot-ink); display: flex; align-items: center; justify-content: center; font-size: 13px; }

  header.nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--line); font-size: 14px; max-width: 1080px; margin: 0 auto; }
  header.nav .logo { font-weight: 800; color: var(--blue); font-size: 17px; }
  header.nav .menu a { margin-left: 20px; color: var(--ink-soft); }
  header.nav .menu a.on { color: var(--ink); font-weight: 700; }
  footer { background: var(--navy); color: #c9d2e3; padding: 28px 24px; font-size: 13px; }

  .hero-bg { background: linear-gradient(180deg, #fff 0%, var(--blue-soft) 100%); }
  .hero { display: grid; grid-template-columns: 1fr 1.1fr; gap: 40px; align-items: center; }
  .devices { position: relative; height: 300px; }
  .laptop { position: absolute; right: 0; top: 24px; width: 80%; }
  .laptop .screen { border: 9px solid #1a1f2b; border-bottom-width: 12px; border-radius: 12px 12px 0 0; height: 220px; }
  .laptop .base { height: 12px; background: #c9d0dc; border-radius: 0 0 12px 12px; margin: 0 -6%; }
  .phone { position: absolute; left: 0; top: 0; width: 30%; height: 290px; border: 8px solid #1a1f2b; border-radius: 24px; overflow: hidden; }
  .phone .shot, .laptop .shot { height: 100%; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 28px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: block; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 8px 24px rgba(37,71,208,.12); }
  .card .num { font-size: 12px; font-weight: 800; color: var(--blue); padding: 14px 16px 0; }
  .card .shot { height: 120px; margin: 10px 16px 0; border-radius: 8px; }
  .card .name { font-size: 16px; font-weight: 700; padding: 12px 16px 0; }
  .card .meta { font-size: 13px; color: var(--ink-soft); padding: 4px 16px 16px; line-height: 1.5; }
  .card.empty { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 14px; min-height: 230px; text-align: center; padding: 16px; }

  /* 실시간 인기 서비스: 왼쪽 순위 판 + 오른쪽 카드 */
  .board { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 28px; align-items: start; }
  .board .cards { grid-template-columns: repeat(3, 1fr); margin-top: 0; }
  .rank { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
  .rank-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rank-head b { font-size: 16px; }
  .rank-head span { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .rank ol { list-style: none; padding: 0; margin-top: 12px; }
  .rank li a { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 15px; }
  .rank li a:hover span { text-decoration: underline; }
  .rank li b { width: 18px; font-weight: 800; }
  .rank li span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .rank li i { font-style: normal; font-size: 11px; font-weight: 800; color: #e8462f; }
  .rank-empty { padding: 24px 0; text-align: center; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .rank-note { margin-top: 10px; font-size: 12px; color: var(--ink-soft); }

  /* 개인정보 처리방침 */
  .policy { max-width: 760px; }
  .policy h3 { font-size: 18px; margin-top: 32px; }
  .policy p, .policy li { font-size: 15px; line-height: 1.75; color: var(--ink); margin-top: 8px; }
  .policy ul { padding-left: 20px; }
  .policy table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  .policy th, .policy td { border: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; line-height: 1.6; }
  .policy th { background: var(--paper); }
  footer a { text-decoration: underline; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 28px; }
  .step { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid var(--line); }
  .step b { display: inline-flex; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; align-items: center; justify-content: center; }
  .step p { font-size: 15px; margin-top: 12px; line-height: 1.6; }
  .banner { background: var(--blue); color: #fff; border-radius: 16px; padding: 32px; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
  .banner .p { color: #dbe3ff; }
  .banner .btn { background: #fff; color: var(--blue); margin: 0; white-space: nowrap; }

  .info { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; border-top: 2px solid var(--navy); }
  .info > div { padding: 22px 18px; border-right: 1px solid var(--line); }
  .info > div:last-child { border-right: 0; }
  .ico { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .info h4 { font-size: 15px; margin-top: 12px; }
  .info p { font-size: 14px; color: var(--ink-soft); margin-top: 6px; line-height: 1.6; white-space: pre-line; }
  .big { font-size: 28px; font-weight: 800; color: var(--navy); margin-top: 8px; }
  .tags span { display: inline-block; font-size: 13px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 6px 13px; margin: 12px 8px 0 0; }
  .feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
  .feat div { background: var(--paper); border-radius: 12px; padding: 20px; font-size: 15px; line-height: 1.6; }
  .feat b { color: var(--blue); font-size: 12px; display: block; margin-bottom: 6px; }
  .soon { border: 1.5px dashed #b9c4d8; border-radius: 12px; padding: 28px; text-align: center; color: var(--ink-soft); font-size: 15px; margin-top: 18px; }
  .sticky { display: none; }

  @media (max-width: 720px) {
    header.nav .menu a { margin-left: 12px; }
    section { padding: 36px 16px; }
    .hero { grid-template-columns: 1fr; }
    .devices { height: 220px; order: -1; }
    .laptop .screen { height: 160px; } .phone { height: 210px; }
    .h1 { font-size: 28px; } .h2 { font-size: 22px; }
    .cards, .board .cards { grid-template-columns: 1fr 1fr; }
    .board { grid-template-columns: 1fr; }
    .card.empty { display: none; }
    .steps, .feat, .info { grid-template-columns: 1fr; }
    .info > div { border-right: 0; border-bottom: 1px solid var(--line); }
    .banner { flex-direction: column; align-items: flex-start; }
    .sticky { display: block; position: sticky; bottom: 0; background: var(--blue); color: #fff; text-align: center; padding: 15px; font-size: 15px; font-weight: 700; }
  }
</style>
</head>

<template id="tpl-privacy">
  <section class="wrap policy">
    <div class="eyebrow">PRIVACY</div>
    <div class="h1">개인정보 처리방침</div>
    <p>하우투경영컨설팅(이하 「운영자」)은 하우투테크에듀에서 받는 개인정보를 「개인정보 보호법」에 따라 처리합니다. 시행일: 2026. 10. 25.</p>

    <h3>1. 받는 항목과 쓰는 목적</h3>
    <table>
      <tr><th>구분</th><th>받는 항목</th><th>쓰는 목적</th></tr>
      <tr><td>서비스 문의</td><td>이름, 학원 이름, 연락처, 문의 내용</td><td>서비스를 만든 사람과 조건을 정해 연락드리기</td></tr>
      <tr><td>교육 관심 등록</td><td>이름, 학원 이름, 연락처, AX 바이블 수료 여부, 궁금한 점</td><td>과정이 열리면 안내하기</td></tr>
      <tr><td>서비스 등록</td><td>구글 계정 이메일, 학원 이름, 연락처</td><td>전시 전 점검, 문의·거래 안내, 수수료 정산</td></tr>
    </table>
    <p>전시 페이지를 둘러볼 때는 개인정보를 받지 않습니다. 인기 순위를 매기려고 서비스 상세 페이지를 연 시각과 서비스 번호만 남기며, 이 기록은 7일 뒤 지웁니다.</p>

    <h3>2. 보관 기간</h3>
    <ul>
      <li>서비스 문의: 문의한 날부터 6개월. 거래가 성사되면 거래가 끝날 때까지</li>
      <li>교육 관심 등록: 등록한 날부터 1년</li>
      <li>서비스 등록: 전시를 마치고 수수료 정산이 끝날 때까지</li>
      <li>계약·결제·정산 기록: 「국세기본법」에 따라 5년</li>
    </ul>
    <p>본인이 원하시면 기간이 남아 있어도 바로 지웁니다.</p>

    <h3>3. 지우는 방법</h3>
    <p>보관 기간이 지나면 운영 시트와 설문지 응답 기록에서 해당 내용을 지체 없이 지웁니다. 운영자는 매일 점검으로 기간이 지난 연락처를 확인합니다.</p>

    <h3>4. 다른 사람에게 주는지</h3>
    <p>받은 개인정보를 다른 사람에게 주지 않습니다. 거래를 위해 서비스를 만든 사람에게 연락처를 알려야 할 때는 미리 본인 동의를 받습니다.</p>

    <h3>5. 보관을 맡기는 곳(국외 보관 포함)</h3>
    <p>설문지 응답과 운영 기록은 구글(Google LLC)의 설문지·스프레드시트 서비스에 저장됩니다. 구글의 서버는 미국 등 국외에 있을 수 있으며, 제출하시는 순간 인터넷으로 옮겨져 위 보관 기간 동안 저장됩니다. 옮기는 항목은 1번 표의 항목과 같습니다. 국외 보관을 원하지 않으시면 설문지를 제출하지 않으시면 되며, 이 경우 문의나 관심 등록을 받을 수 없습니다.</p>
    <p>문의·관심 등록이 들어오면 운영자에게 카카오톡 알림이 가지만, 알림에는 연락처 등 개인정보를 넣지 않습니다.</p>

    <h3>6. 본인의 권리</h3>
    <p>언제든지 내 개인정보를 열람하거나 고쳐 달라고, 지워 달라고, 처리를 멈춰 달라고 요구하실 수 있습니다. 아래 연락처로 알려 주시면 지체 없이 처리합니다.</p>

    <h3>7. 안전하게 지키는 방법</h3>
    <ul>
      <li>운영 시트는 운영자 계정 한 명만 열 수 있습니다.</li>
      <li>연락처·이메일은 전시 페이지에 나가지 않습니다.</li>
    </ul>

    <h3>8. 개인정보 보호책임자</h3>
    <p>성명: [기재 예정] · 연락처: [기재 예정]</p>

    <h3>9. 처리방침이 바뀔 때</h3>
    <p>내용이 바뀌면 이 페이지에 바뀐 내용과 시행일을 알립니다.</p>
  </section>

</template>

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function splitItems(text) {
  return String(text || '').split(/\n|\s\/\s/).map(function (x) { return x.trim(); }).filter(String);
}
function load(view) {
  return fetch(API + '?api=1' + (view ? '&view=' + encodeURIComponent(view) : '')).then(function (r) { return r.json(); });
}
function show(id) {
  document.getElementById('app').innerHTML = document.getElementById(id).innerHTML;
}

function renderBoard(data) {
  var rank = data.popular.length
    ? '<ol>' + data.popular.map(function (r, i) {
        return '<li><a href="?id=' + encodeURIComponent(r.id) + '"><b>' + (i + 1) + '</b><span>' + esc(r.name) + '</span>' + (r.isNew ? '<i>N</i>' : '') + '</a></li>';
      }).join('') + '</ol>'
    : '<div class="rank-empty">공개된 서비스가 생기면<br>순위가 나옵니다</div>';
  var cards = data.services.map(function (s, i) {
    return '<a class="card" href="?id=' + encodeURIComponent(s.id) + '"><div class="num">' + ('0' + (i + 1)).slice(-2) + '</div>' +
      '<div class="shot">화면 준비 중</div><div class="name">' + esc(s.name) + '</div><div class="meta">' + esc(s.oneLiner) + '<br>' + esc(s.academy) + '</div></a>';
  }).join('');
  document.getElementById('board').innerHTML =
    '<aside class="rank"><div class="rank-head"><b>실시간 인기 서비스</b><span>오늘 ' + esc(data.updated) + ' 기준</span></div>' + rank +
    '<div class="rank-note">최근 7일 조회 수 기준</div></aside>' +
    '<div class="cards">' + cards + '<div class="card empty">곧 더 많은 서비스가<br>올라옵니다</div></div>';
}

function renderDetail(s) {
  var ask = INQUIRY + encodeURIComponent(s.id);
  var tags = s.transfer.split(',').map(function (t) { return '<span>' + esc(t.trim()) + '</span>'; }).join('');
  var feats = splitItems(s.features).map(function (f, i) { return '<div><b>기능 ' + (i + 1) + '</b>' + esc(f) + '</div>'; }).join('');
  document.getElementById('app').innerHTML =
    '<div class="hero-bg"><section class="wrap hero"><div>' +
      '<a class="p" style="margin:0" href="./">← 서비스 목록</a>' +
      '<div class="eyebrow" style="margin-top:14px">SERVICE ' + esc(s.id) + '</div>' +
      '<div class="h1">' + esc(s.name) + '</div>' +
      '<div class="p">' + esc(s.oneLiner) + ' · ' + esc(s.academy) + '</div>' +
      '<div class="tags">' + tags + '</div>' +
      '<div>' + (s.demo ? '<a class="btn" href="' + esc(s.demo) + '" target="_blank" rel="noopener">체험해 보기</a>' : '') +
      '<a class="btn ghost" href="' + esc(ask) + '" target="_blank" rel="noopener">문의하기</a></div>' +
    '</div><div class="devices"><div class="laptop"><div class="screen"><div class="shot">화면 준비 중</div></div><div class="base"></div></div>' +
    '<div class="phone"><div class="shot">모바일</div></div></div></section></div>' +
    '<section class="wrap"><div class="eyebrow">PROBLEM</div><div class="h2">해결하는 문제와 쓰는 사람</div>' +
      '<div class="p">' + esc(s.problem) + '</div><div class="feat">' + feats + '</div></section>' +
    '<div style="background:var(--paper)"><section class="wrap"><div class="eyebrow">RESULT</div><div class="h2">실제로 써 본 결과</div><div class="info">' +
      '<div><div class="ico">◷</div><h4>사용 기간</h4><div class="big">' + esc(s.period) + '</div></div>' +
      '<div><div class="ico">◉</div><h4>쓴 사람</h4><div class="big">' + esc(s.users) + '</div></div>' +
      '<div><div class="ico">✎</div><h4>써 보고 고친 것</h4><p>' + esc(s.fixes) + '</p></div></div></section></div>' +
    '<section class="wrap"><div class="eyebrow">CHECK</div><div class="h2">판매 전 점검</div><div class="info">' +
      '<div><div class="ico">🔒</div><h4>개인정보 처리</h4><p>' + esc(s.privacy) + '</p></div>' +
      '<div><div class="ico">©</div><h4>교재·문항 저작권</h4><p>' + esc(s.copyright) + '</p></div>' +
      '<div><div class="ico">☎</div><h4>고장 시 담당자</h4><p>' + esc(s.maintainer) + '</p></div></div></section>' +
    '<div style="background:var(--blue-soft)"><section class="wrap center"><div class="h2">이 서비스가 궁금하다면</div>' +
      '<div class="p">문의를 남기면 운영자가 조건을 정해 연락드립니다.</div>' +
      '<a class="btn" href="' + esc(ask) + '" target="_blank" rel="noopener">문의하기</a></section></div>' +
    '<a class="sticky" href="' + esc(ask) + '" target="_blank" rel="noopener">문의하기</a>';
}

var q = new URLSearchParams(location.search);
var page = q.get('page'), id = q.get('id');
document.getElementById(page === 'edu' ? 'menu-edu' : 'menu-services').className = 'on';
if (page === 'edu' || page === 'privacy') {
  show('tpl-' + page);
} else if (id) {
  load(id).then(function (data) {
    var s = data.services.filter(function (x) { return x.id === id; })[0];
    if (s) renderDetail(s); else location.replace('./');
  });
} else {
  show('tpl-home');
  load().then(renderBoard, function () {
    document.getElementById('board').innerHTML = '<div class="rank"><div class="rank-empty">서비스 목록을 불러오지 못했습니다.<br>잠시 뒤 다시 열어 주세요.</div></div>';
  });
}
</script>
</body>
</html>
